# Continuous integration for the prototype workspace.
#
# - rust:             fmt / clippy (-D warnings) / test / build on the host toolchain
# - guest-musl-build: static Linux (musl) build of the guest side (bridge + examples),
#                     which is what the firecracker provider ships into the microVM
# - scripts:          bash -n + shellcheck + helper self-test for scripts/
#
# No secrets are used. The KVM/firecracker end-to-end run lives in
# kvm-integration.yml and is never triggered by pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0 (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: host

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

  guest-musl-build:
    name: guest musl build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0 with the musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Build guest binaries (static)
        run: >
          cargo build --release --target x86_64-unknown-linux-musl
          -p tachyon-serverless-runtime-bridge
          -p example-hello
          -p example-http-axum
          -p example-cpu-burn
          -p example-isolation-probe

      - name: Verify the binaries are static
        run: |
          set -euo pipefail
          for b in tachyon-serverless-runtime-bridge example-hello example-http-axum example-cpu-burn example-isolation-probe; do
            f="target/x86_64-unknown-linux-musl/release/$b"
            test -x "$f"
            file "$f"
            if ldd "$f" 2>&1 | grep -q "=>"; then
              echo "$f is dynamically linked" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: guest-x86_64-musl
          if-no-files-found: error
          retention-days: 7
          path: |
            target/x86_64-unknown-linux-musl/release/tachyon-serverless-runtime-bridge
            target/x86_64-unknown-linux-musl/release/example-hello
            target/x86_64-unknown-linux-musl/release/example-http-axum
            target/x86_64-unknown-linux-musl/release/example-cpu-burn
            target/x86_64-unknown-linux-musl/release/example-isolation-probe

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq

      - name: bash -n
        run: |
          set -euo pipefail
          git ls-files '*.sh' | while read -r f; do
            bash -n "$f"
            echo "syntax ok: $f"
          done

      - name: shellcheck
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          shellcheck -x -P scripts/e2e $(git ls-files '*.sh')

      - name: e2e helper self-test
        run: scripts/e2e/selftest.sh
