# Continuous integration for the prototype workspace (always-on, hosted runners only).
#
# Gate matrix: docs/ci.md. Branch protection should require exactly `ci-gate` (this file) and
# `kvm-gate` (kvm-integration.yml); both aggregate their jobs and never turn "did not run" into a
# silent pass.
#
# - changes:             classify the changed paths (scripts/ci/classify-changes.sh)
# - rust:                fmt / clippy (-D warnings) / test / build on the host toolchain
# - contracts:           named contract gates: OpenAPI snapshot (docs/openapi.json), protocol
#                        golden fixtures (crates/protocol/tests/golden/), security regression
#                        group (scripts/ci/security-regression.list)
# - guest-musl-build:    static Linux (musl) build of the guest side (bridge + examples),
#                        which is what the firecracker provider ships into the microVM
# - durable-queue:       pinned nats-server (checksum-verified, local process) + scripts/queue/verify.sh:
#                        auth refusal, kill -9 persistence, capacity, max_age, JetStream contract,
#                        object store (PLT-4638); scripts/queue/async-e2e.sh: invokeAsync + outbox
#                        crash/outage convergence (PLT-4639); scripts/queue/triggers-e2e.sh: cron
#                        and signed webhook triggers (PLT-4641); scripts/queue/async-dispatch-e2e.sh:
#                        dispatcher, retry, DLQ, poison, redrive, SIGKILL before ACK / commit (PLT-4640)
# - scripts:             bash -n + shellcheck + helper self-tests for scripts/
# - console:             apps/console lint / typecheck / vitest / API types vs docs/openapi.json /
#                        static export (PLT-4644; the Playwright E2E is local only)
# - ci-gate:             aggregate status
#
# Docs-only changes (docs/**, *.md, issue templates; NOT docs/openapi.json) skip rust,
# contracts and guest-musl-build; ci-gate then reports success because nothing they cover
# changed. No secrets are used and the token is read-only. The KVM / Firecracker run lives in
# kvm-integration.yml on a self-hosted runner and is never scheduled for fork pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual full run (e.g. on a branch before opening a PR); classifies as "everything changed".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      kvm_required: ${{ steps.classify.outputs.kvm_required }}
      contract: ${{ steps.classify.outputs.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) scripts/ci/classify-changes.sh --base "$PR_BASE" --head "$SHA" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                scripts/ci/classify-changes.sh --all
              else
                scripts/ci/classify-changes.sh --base "$PUSH_BEFORE" --head "$SHA"
              fi
              ;;
            *) scripts/ci/classify-changes.sh --all ;;
          esac

  rust:
    name: fmt / clippy / test / build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0 (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: host

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The test-only failpoints (PLT-4639) compile only into the async E2E gateway; keep them
      # warning-free too.
      - name: clippy (feature failpoints)
        run: cargo clippy -p tachyon-serverless-gateway -p tachyon-serverless-application --all-targets --features tachyon-serverless-application/failpoints -- -D warnings

      # A hung test must fail this step instead of holding the whole job until its 45 min
      # timeout (a warm run takes ~2-3 min; the bound leaves room for a cold cache).
      - name: test (unit / property / integration, all crates)
        timeout-minutes: 25
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

  contracts:
    name: contracts (OpenAPI / wire golden / security regression)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: contracts

      - name: OpenAPI snapshot (docs/openapi.json)
        run: cargo test -p tachyon-serverless-gateway --test openapi_snapshot

      - name: Protocol golden fixtures (host <-> bridge frames, Runtime API JSON)
        run: cargo test -p tachyon-serverless-protocol --test golden

      - name: Security regression group (tenant / reuse key / lease / deadline / egress / limits)
        run: scripts/ci/security-regression.sh

      - name: Snapshots are committed (no generated file differs from the tree)
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- docs/openapi.json crates/protocol/tests/golden)" ]; then
            git status --porcelain -- docs/openapi.json crates/protocol/tests/golden
            echo "::error::a contract snapshot was modified by the test run" >&2
            exit 1
          fi

  guest-musl-build:
    name: guest musl build (x86_64-unknown-linux-musl)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0 with the musl target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: musl

      - name: Build guest binaries (static)
        run: >
          cargo build --release --target x86_64-unknown-linux-musl
          -p tachyon-serverless-runtime-bridge
          -p example-hello
          -p example-http-axum
          -p example-cpu-burn
          -p example-isolation-probe

      - name: Verify the binaries are static
        run: |
          set -euo pipefail
          for b in tachyon-serverless-runtime-bridge example-hello example-http-axum example-cpu-burn example-isolation-probe; do
            f="target/x86_64-unknown-linux-musl/release/$b"
            test -x "$f"
            file "$f"
            if ldd "$f" 2>&1 | grep -q "=>"; then
              echo "$f is dynamically linked" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-x86_64-musl
          if-no-files-found: error
          retention-days: 7
          path: |
            target/x86_64-unknown-linux-musl/release/tachyon-serverless-runtime-bridge
            target/x86_64-unknown-linux-musl/release/example-hello
            target/x86_64-unknown-linux-musl/release/example-http-axum
            target/x86_64-unknown-linux-musl/release/example-cpu-burn
            target/x86_64-unknown-linux-musl/release/example-isolation-probe

  durable-queue:
    name: durable queue and objects (NATS JetStream, object store)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: durable-queue

      # Downloads the nats-server release pinned in deploy/nats/versions.env, refuses it unless its
      # sha256 matches, runs it as a local process (no docker), and checks auth refusal, kill -9
      # persistence, discard-new capacity, max_age, the JetStream contract suite
      # (TACHYON_NATS_REQUIRED=1: a missing server fails instead of skipping) and the object store.
      - name: scripts/queue/verify.sh
        run: scripts/queue/verify.sh --evidence "$RUNNER_TEMP/queue-evidence"

      # PLT-4639: invokeAsync against the real nats-server and object store, with a gateway built
      # with the test-only `failpoints` feature: SIGKILL at four failpoints + restart, a stopped
      # nats-server (outbox fills, 503 queue_unavailable, drains after restart), orphan GC, and
      # every accepted invocation found exactly once logically in JetStream.
      - name: scripts/queue/async-e2e.sh
        run: scripts/queue/async-e2e.sh --evidence "$RUNNER_TEMP/queue-evidence/async-e2e"

      # PLT-4641: cron and signed webhook triggers with the embedded SQLite queue (no nats-server):
      # a 6-field cron trigger fires, SIGKILL / SIGTERM restarts never fire a scheduled time twice,
      # disable stops fires, and webhook deliveries signed with openssl are accepted, deduplicated
      # by event id and signature, and refused (401 / 413 / 400) before anything is stored. ~1 min.
      - name: scripts/queue/triggers-e2e.sh
        run: scripts/queue/triggers-e2e.sh --evidence "$RUNNER_TEMP/queue-evidence/triggers-e2e"

      # PLT-4640: the asynchronous dispatcher against the real nats-server with the process provider
      # and examples/idempotent-async: retries with backoff, attempts_exhausted / non_retryable /
      # poison dead letters, SIGKILL after the terminal commit (redelivery acked without running)
      # and after the side effect before the commit (re-executed, effect once), redrive authz and
      # audit, and one terminal record / dead letter per invocation in state.db.
      - name: scripts/queue/async-dispatch-e2e.sh
        run: scripts/queue/async-dispatch-e2e.sh --evidence "$RUNNER_TEMP/queue-evidence/async-dispatch-e2e"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: queue-evidence
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/queue-evidence

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install shellcheck and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq

      - name: bash -n
        run: |
          set -euo pipefail
          git ls-files '*.sh' | while read -r f; do
            bash -n "$f"
            echo "syntax ok: $f"
          done

      - name: shellcheck
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          shellcheck -x -P scripts/e2e $(git ls-files '*.sh')

      - name: e2e helper self-test
        run: scripts/e2e/selftest.sh

      - name: CI helper self-test (path classification, kvm-gate, security list)
        run: scripts/ci/selftest.sh

  # PLT-4644: static checks of the Functions console (apps/console). The Playwright E2E needs a
  # built gateway, Chromium and ~1 min of real invokes; it runs locally (scripts/console/e2e.sh,
  # docs/console.md) and is not a CI job.
  console:
    name: console (lint / typecheck / unit / API types / build)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.1
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: lint (biome)
        run: pnpm lint

      - name: typecheck
        run: pnpm ts

      - name: unit tests (vitest)
        run: pnpm test

      - name: API types match docs/openapi.json
        run: pnpm check:api

      - name: static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  ci-gate:
    name: ci-gate
    needs: [changes, rust, contracts, guest-musl-build, durable-queue, scripts, console]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required results
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          R_CHANGES: ${{ needs.changes.result }}
          R_RUST: ${{ needs.rust.result }}
          R_CONTRACTS: ${{ needs.contracts.result }}
          R_MUSL: ${{ needs.guest-musl-build.result }}
          R_QUEUE: ${{ needs.durable-queue.result }}
          R_SCRIPTS: ${{ needs.scripts.result }}
          R_CONSOLE: ${{ needs.console.result }}
        run: |
          set -euo pipefail
          fail=0
          check() { # name result skip_allowed
            if [ "$2" = success ]; then
              echo "ok      $1"
            elif [ "$2" = skipped ] && [ "$3" = true ]; then
              echo "skipped $1 (docs-only change)"
            else
              echo "FAILED  $1: $2"
              fail=1
            fi
          }
          check changes "$R_CHANGES" false
          check scripts "$R_SCRIPTS" false
          skip_ok=false
          if [ "$R_CHANGES" = success ] && [ "$DOCS_ONLY" = true ]; then skip_ok=true; fi
          check rust "$R_RUST" "$skip_ok"
          check contracts "$R_CONTRACTS" "$skip_ok"
          check guest-musl-build "$R_MUSL" "$skip_ok"
          check durable-queue "$R_QUEUE" "$skip_ok"
          check console "$R_CONSOLE" "$skip_ok"
          {
            echo "### ci-gate"
            echo
            echo "docs_only=$DOCS_ONLY changes=$R_CHANGES rust=$R_RUST contracts=$R_CONTRACTS guest-musl-build=$R_MUSL durable-queue=$R_QUEUE scripts=$R_SCRIPTS console=$R_CONSOLE"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$fail"
