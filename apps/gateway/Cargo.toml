[package]
name = "tachyon-serverless-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tachyon Serverless gateway: management API, synchronous invoke, HTTP adapter, logs and OpenAPI."

[lib]
path = "src/lib.rs"

[[bin]]
name = "tachyon-serverless-gateway"
path = "src/main.rs"

[features]
default = []
# Enables construction of the real providers (process / firecracker). Off by
# default so that the gateway compiles while those crates are still being
# implemented; the integrator turns it on once their constructors exist.
providers = [
  "dep:tachyon-serverless-provider-process",
  "dep:tachyon-serverless-provider-firecracker",
]

[dependencies]
tachyon-serverless-domain = { workspace = true }
tachyon-serverless-protocol = { workspace = true }
tachyon-serverless-provider-port = { workspace = true }
tachyon-serverless-api-types = { workspace = true }
tachyon-serverless-application = { workspace = true }
tachyon-serverless-provider-process = { workspace = true, optional = true }
tachyon-serverless-provider-firecracker = { workspace = true, optional = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
tachyon-serverless-provider-fake = { workspace = true }
tempfile = { workspace = true }
