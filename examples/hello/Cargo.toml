[package]
name = "example-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# Example: JSON event handler built on `tachyon_serverless_sdk::run`.
# Payload {"name": "..."} -> {"message": "hello, <name>", "greeting", "secret_present", "unisolated"}.
# {"fail": true} returns a handler error, {"panic": true} panics, and the env var
# HELLO_FAIL_INIT=1 makes the process report an init error before it becomes ready.
# The example performs no network access.
description = "Tachyon Serverless example: JSON event handler (hello, <name>) demonstrating env vars, secrets, handler errors, panics and init errors."

[dependencies]
tachyon-serverless-sdk = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
