[package]
name = "example-restore-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# Example (PLT-4654, X1, experimental): the verification sample for snapshot restore.
# bootstrap builds a large deterministic synthetic table (RESTORE_VERIFY_DATASET_MIB, default
# 64) with a known sha256 and a precomputed digest chain; after_restore creates everything that
# must differ per copy: instance id, token, RNG, clock/timer readings, a loopback "DB" server
# and session, a loopback TLS server/client with a certificate generated after the restore, and
# a scratch file keyed by the instance id. The handler reports all of it so a script can check
# that the fixed data was restored and the per-instance state diverged. Synthetic data only; no
# network access beyond 127.0.0.1 inside the guest.
description = "Tachyon Serverless example: restore verification sample (fixed dataset, per-instance identity / RNG / clock / loopback DB + TLS / scratch) with synthetic data."

[dependencies]
tachyon-serverless-sdk = { workspace = true, features = ["experimental-restore"] }
serde_json = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
