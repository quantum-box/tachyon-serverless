[package]
name = "tachyon-serverless-runtime-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Guest-side runtime bridge: connects to the host over vsock or a unix socket, serves the Runtime API to the user process and supervises it."

[dependencies]
tachyon-serverless-protocol = { workspace = true }
tachyon-serverless-sdk = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
