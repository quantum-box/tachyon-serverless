[package]
name = "tachyon-serverless-provider-firecracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Firecracker (Linux/KVM) execution provider: microVM lifecycle over the Firecracker API socket, guest bridge over vsock, per-environment function drive and cleanup."

[features]
default = []
# PLT-4653 (X1, experimental): snapshot at the SDK checkpoint and clone into a new jail /
# cgroup / scratch copy. Off by default; with it the snapshot capabilities are `Unverified`
# (jailer required) instead of `Unsupported`.
experimental-restore = []

[dependencies]
tachyon-serverless-domain = { workspace = true }
tachyon-serverless-protocol = { workspace = true }
tachyon-serverless-provider-port = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "fc-smoke"
path = "src/bin/fc-smoke.rs"
