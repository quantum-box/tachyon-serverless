[package]
name = "tachyon-serverless-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust SDK for Tachyon Serverless functions: run(handler), serve_http(router) and the invocation Context, speaking the in-guest Runtime API."

[features]
default = []
# PLT-4651 (X1, experimental): `lifecycle` builder with a synchronous bootstrap
# before a checkpoint point and an after-restore hook. Off by default; `run` and
# `serve_http` behave identically with or without it.
experimental-restore = []

[dependencies]
tachyon-serverless-protocol = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
