[package]
name = "tachyon-serverless-application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Application layer: configuration, repositories, local ports, host-side bridge session and the invoke pipeline."

[features]
# Test-only failpoints in the asynchronous acceptance and outbox paths
# (src/failpoints.rs, docs/adr/0010). Always on for this crate's unit tests;
# the feature turns them on in a built gateway for the async E2E
# (scripts/queue/async-e2e.sh). Never enable it in a production build.
failpoints = []

[dependencies]
tachyon-serverless-domain = { workspace = true }
tachyon-serverless-protocol = { workspace = true }
tachyon-serverless-provider-port = { workspace = true }
tachyon-serverless-durable-port = { workspace = true }
aes-gcm = { workspace = true }
getrandom = { workspace = true }
tachyon-serverless-api-types = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
mysql = { workspace = true }
tachyon-serverless-durable-port = { workspace = true, features = ["testkit"] }
ulid = { workspace = true }
tachyon-serverless-provider-fake = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
