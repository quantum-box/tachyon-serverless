listen = "127.0.0.1:46481"
profile = "dev"
data_dir = "/home/takanorifukuyama.guest/w/tsls-chaos.kP4x75/data"

[provider]
kind = "firecracker"

[provider.firecracker]
firecracker_binary = "/home/takanorifukuyama.guest/tsls/.kvm/bin/firecracker"
kernel = "/home/takanorifukuyama.guest/tsls/.kvm/vmlinux"
rootfs = "/home/takanorifukuyama.guest/tsls/.kvm/rootfs.ext4"    # read-only base rootfs（/sbin/tachyon-init = runtime-bridge）
workdir = "/home/takanorifukuyama.guest/w/tsls-chaos.kP4x75/data/fc"           # 環境ごとの API socket / vsock uds / function drive / log
vsock_port = 5000

# egress restricted / public-web（PLT-4622、docs/adr/0005-egress-profiles.md）。
# 環境ごとに tap と nftables の chain（table inet tachyon_egress）を作るので、gateway を root
# （または CAP_NET_ADMIN）で動かし、host の net.ipv4.ip_forward を 1 にしておく。満たさない host では
# 2 つの capability が理由付きの unsupported になり、egress none だけが動く。省略時は下の既定値。
# VMM の host 側 cgroup v2 上限（PLT-4622、docs/kvm.md §3.6）。環境ごとに
# <root>/<parent>/<env_id> を作り、cpu.max = cpu_millis 相当（500m -> "50000 100000"、全 vCPU と
# VMM の thread の合計）、memory.max = guest memory + memory_overhead_mib、pids.max を書いて読み戻し、
# VMM を exec 前にその cgroup へ入れて cgroup.procs で所属を確認する。profile = "production" では
# mode は required（省略時も required、best-effort / off は設定エラー）で、root の cgroup.procs に
# 書けない host（gateway が root でない、委譲が無い）では preflight が失敗し環境の作成を拒否する。
# dev profile の省略時は best-effort（使えなければ上限なしで起動し、capability を unverified にする）。
[provider.firecracker.cgroup]
mode = "required"
# root = "/sys/fs/cgroup"        # cgroup v2 の root か、gateway に委譲された subtree
# parent = "tachyon"
# memory_overhead_mib = 64       # VMM 自身と drive の page cache の分
# pids_max = 64

# jailer（PLT-4622）。gateway を root で動かし、VMM を jailer 経由で起動する:
# <chroot_base>/<firecracker のファイル名>/<instance id>/root に chroot、uid / gid へ降格、
# mount / PID namespace を分離、Firecracker 既定の seccomp filter。kernel / rootfs / drive / fc.log は
# chroot へ hard link するので chroot_base は workdir・kernel・rootfs と同じ file system に置く。
# jailer は Firecracker と同じ release のもの（scripts/kvm/bootstrap.sh が .kvm/bin/jailer に置く）。
[provider.firecracker.jailer]
enabled = true
binary = "/home/takanorifukuyama.guest/tsls/.kvm/bin/jailer"
uid = 64000
gid = 64000
# chroot_base = "/srv/jailer"
# new_pid_ns = true

# [provider.firecracker.network]
# guest_cidr = "172.30.0.0/16"   # 環境ごとの /30 を切り出す private 範囲
# dns_resolver = "1.1.1.1"       # public-web の guest が問い合わせてよい唯一の DNS（公開アドレスのみ）
# nft_binary = "nft"
# ip_binary = "ip"

