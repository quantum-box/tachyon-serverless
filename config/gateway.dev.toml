# Tachyon Serverless gateway — 開発用設定（process provider、隔離なし）
#
# process provider は dev 専用です。`profile = "production"` では拒否されます。
# ここに書く token / secret はローカル開発専用のダミー値です。本物の秘密を書かないでください。

listen = "127.0.0.1:8080"
profile = "dev"                # dev | production
data_dir = "./data"            # artifacts/ と state.db（台帳）の置き場所

[provider]
kind = "process"               # process | firecracker（fake は設定からは選べない）

[provider.process]
bridge_binary = "target/debug/tachyon-serverless-runtime-bridge"
workdir = "./data/process"     # 環境ごとに <workdir>/<environment_id> が作られる

[capacity]
max_concurrency = 8            # node 全体で Starting + Busy の環境数の上限
max_queue = 32                 # 空き待ちできる invoke 数（超過は 429、reason = queue_full）
queue_timeout_seconds = 10     # 空き待ちの上限（超過は 504 queue_timeout、reason = capacity | quota | queue_deadline）
max_queue_bytes = 33554432     # 待ち行列が保持できる payload の合計（超過は 429 queue_full）

# admission・autoscaler（PLT-4634、docs/adr/0006-autoscaling-and-admission.md）。
# 省略時は資源の上限なし・tenant quota なし（max_concurrency だけが効く）。
# [capacity.node]
# name = "dev-mac"
# region = "jp"                  # 配置ラベル。required_region を持つ tenant / revision はこれが一致する node でだけ動く
# cpu_millis = 8000              # 省略した次元は上限なし
# memory_mib = 16384
# ephemeral_storage_mib = 65536
# vmm_overhead_memory_mib = 16   # 環境ごとに予約へ足す VMM の常駐分（推定値。実測で置き換える）
# bridge_overhead_memory_mib = 8 # 環境ごとに予約へ足す guest bridge 分
# overhead_cpu_millis = 0
# overhead_storage_mib = 0
#
# [capacity.tenant_defaults]     # 明示しない tenant すべて
# max_concurrency = 6            # 1 tenant が同時に持てる環境数。max_concurrency 未満にしないと、
#                                # 先に来た長時間の tenant が全枠を取り、終わるまで他を待たせうる（非 preemptive）
# max_queue = 16                 # 1 tenant が待ち行列に置ける数（超過は 429、reason = quota）
# weight = 1                     # 公平キューの重み
#
# [[capacity.tenants]]
# tenant_id = "tn_01hzzzzzzzzzzzzzzzzzzzzzzb"
# required_region = "jp"         # jp-only。node の region が違う・無いときは 503 placement（緩めない）
# max_concurrency = 2
#
# [capacity.start_rate]          # cold start の token bucket
# per_second = 20
# burst = 20
#
# [capacity.circuit_breaker]     # revision ごと。連続した起動失敗で open → 503 circuit_open
# failure_threshold = 5
# cooldown_seconds = 30          # 経過後に 1 件だけ probe を通す
#
# [capacity.autoscaler]
# rate_window_seconds = 10       # 到着率の減衰時定数

[invoke]
inline_output_max_bytes = 65536   # これ以下の出力は台帳にインライン保存
cancel_grace_ms = 1000            # Cancel 後に guest へ与える猶予
preflight_ttl_seconds = 30        # /readyz の preflight キャッシュ
handshake_timeout_ms = 5000       # bridge 接続後 Hello を待つ時間

# [limits]                       # 省略時は domain の既定値
# max_payload_bytes = 1048576
# max_artifact_bytes = 268435456

[[identity.tokens]]
token = "dev-token-tenant-a"
tenant_id = "tn_01hzzzzzzzzzzzzzzzzzzzzzza"
subject = "dev-a"
roles = ["deploy", "invoke"]

[[identity.tokens]]
token = "dev-token-tenant-b"
tenant_id = "tn_01hzzzzzzzzzzzzzzzzzzzzzzb"
subject = "dev-b"
roles = ["deploy", "invoke"]

[[secrets.bindings]]
tenant_id = "tn_01hzzzzzzzzzzzzzzzzzzzzzza"
binding_ref = "demo-secret"
value = "demo-secret-value-a"

[[secrets.bindings]]
tenant_id = "tn_01hzzzzzzzzzzzzzzzzzzzzzzb"
binding_ref = "demo-secret"
value = "demo-secret-value-b"

# 台帳（Function / Revision / Alias / Invocation / Attempt / Environment / Lease）。
# 既定は <data_dir>/state.db（埋め込み SQLite、WAL、前進のみの migration）。
# 旧版の <data_dir>/state.json があれば初回起動時に一度だけ取り込み、
# state.json.imported-<UTC> に rename する（docs/adr/0003-execution-state-persistence.md）。
# secret の値は台帳に書かない。invocation の入力は digest だけ、出力は
# [invoke] inline_output_max_bytes 以下のときだけ本文を持ち、保持期限を過ぎると digest に置き換える。
[store]
backend = "sqlite"                 # sqlite | memory（memory は再起動で全て消える）
output_retention_seconds = 604800  # インライン出力の保持期限（7 日）。0 は無期限

# invocation log は <data_dir>/logs/logs.db（docs/adr/0018）。既定値のまま。
# [logs]
# retention_seconds = 604800       # 最後の行からこれを過ぎた invocation の log を消す
# max_total_bytes = 1073741824     # 超えたら terminal の invocation を古い順に消す

# 起動時の後始末。既定は true で、台帳の収束と孤児環境の回収を listener を
# 開ける前に行う（docs/architecture.md §4「起動時の後始末」）。
# [reconcile]
# on_startup = true

# 環境 pool（warm 再利用）。既定は off。
# on にしても、provider が idle_quiesce / idle_resume を Supported と報告しない
# 限り再利用は行われない。process は Unsupported なので常に destroy-after-invoke。
# firecracker は PLT-4633 の実機計測（docs/evidence/warm-20260916T162532Z/）を経て
# Supported なので、enabled = true にすれば warm 再利用が働く。
# docs/architecture.md §4「環境 pool と再利用キー」。
# [pool]
# enabled = false
# max_idle_per_revision = 1     # reuse key ごとに idle で残す環境数
# idle_ttl_seconds = 60         # これを超えて idle な環境は sweeper が破棄する
# max_total_idle = 8            # 全 reuse key 合計の idle 上限
# allow_unverified_idle = false # 計測専用。Unverified の idle capability を受け入れる。
#                               # profile = "production" では拒否される（docs/kvm.md §3.7）

# スケール to zero・min_ready・drain（PLT-4635、docs/adr/0009）。省略時の値:
# [scaling]
# reconcile_interval_ms = 1000       # scale reconciler（idle sweep・min_ready・drain）の周期
# scale_down_cooldown_seconds = 30   # scale-up / 活性化の後この間は scale-down しない（revision の既定）
# drain_timeout_seconds = 961        # 省略時 = limits.max_execution_timeout_seconds + cancel grace + 60 s。
#                                    # どの revision の timeout より長いので、alias 切替・削除の drain が
#                                    # 自分の timeout の内側にいる invocation を止めることはない
# allow_short_drain = false          # drain_timeout_seconds を「最大 timeout + grace」以下にするときだけ true
# prestart_backoff_seconds = 5       # min_ready の先行起動が失敗した後の待ち

# GET /metrics（PLT-4637、docs/metrics.md）。全 tenant の revision・待ちを含むので operator 専用の
# credential でだけ応答する。未設定なら 404。tenant の token と同じ値は設定検証で拒否される。
# [metrics]
# bearer_token = "change-me-metrics-operator-token"   # 16 bytes 以上
# max_revision_series = 64       # 超えた revision は tenant="_other",revision="_other" に合算
# max_tenant_series = 32
# max_environment_series = 128

# 非同期イベントの durable queue と大きな入出力の object store（PLT-4638、docs/adr/0008）。
# 既定はどちらも "none" で、何も接続・作成しない（同期 invoke だけの gateway のまま）。
# invoke pipeline はまだ使わない（invokeAsync は PLT-4639）。単一 node・複製なしで HA ではない。
# [queue]
# backend = "nats"               # none | sqlite（<data_dir>/queue.db、dev 専用）| nats
# [queue.nats]
# url = "nats://127.0.0.1:14222" # scripts/queue/up.sh が起動するローカル nats-server
# user = "gateway"
# password_file = "target/queue/nats/gateway.password"   # up.sh が生成（0600）。匿名接続は設定できない
# [queue.limits]
# max_messages = 100000
# max_age_seconds = 604800
#
# [objects]
# backend = "filesystem"         # none | filesystem（<data_dir>/objects、AES-256-GCM）
# key_file = "secrets/object.key"  # 64 hex 文字、mode 0600（例: openssl rand -hex 32 > secrets/object.key）
# regions = ["local"]
# max_object_bytes = 8388608
# tenant_quota_bytes = 1073741824

# Functions console（PLT-4644、docs/console.md）。既定は無効。有効にすると gateway が
# apps/console の static export を /console/ で配る（credential は持たず、画面は閲覧者の token で /v1 を呼ぶ）。
# 事前に `cd apps/console && pnpm install --frozen-lockfile && pnpm build` が要る（out/index.html が無いと起動しない）。
# [console]
# enabled = true
# dir = "apps/console/out"
